<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>错题星 · AI 学习诊断与个性化训练</title>
<meta name="description" content="错题星：拍照上传错题，AI 识别题目、拆解知识点、定位错因，生成分层同类题并按遗忘曲线安排复习。">
<meta name="theme-color" content="#2F6BFF">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%232F6BFF'/%3E%3Cpath d='M50 18l7.6 21.6H81L63.7 52.3l6.7 22.2L50 61.1 29.6 74.5l6.7-22.2L19 39.6h23.4z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app">
  <!-- ===== 侧边栏 ===== -->
  <aside class="sidebar">
    <a class="side-brand" href="#/dashboard">
      <span class="sb-logo">★</span>
      <span class="sb-text"><b>错题星</b><small>AI 学习诊断</small></span>
    </a>

    <button class="side-scan" data-action="upload">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 5v14M5 12h14"/></svg>
      拍照诊断
    </button>

    <nav class="side-nav">
      <a href="#/dashboard" data-nav="dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>
        今日
      </a>
      <a href="#/mistakes" data-nav="mistakes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 4.5v15"/></svg>
        错题本 <span class="nav-badge" id="navCount">5</span>
      </a>
      <a href="#/practice" data-nav="practice">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.2"/></svg>
        专项训练
      </a>
      <a href="#/review" data-nav="review">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        复习计划 <span class="nav-dot"></span>
      </a>
      <a href="#/report" data-nav="report">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
        学习报告
      </a>
    </nav>

    <div class="side-foot">
      <div class="side-user"><span class="su-avatar">何</span><span class="su-text"><b>何同学</b><small>高三 · 连续学习 12 天</small></span></div>
      <a class="side-back" href="../index.html">← 返回产品介绍</a>
      <div class="side-note">产品原型 · AI 分析由 ai.js 提供内置样例</div>
    </div>
  </aside>

  <!-- ===== 主区域 ===== -->
  <div class="main">
    <header class="topbar">
      <div class="topbar-title" id="topTitle">今日</div>
      <div class="topbar-actions">
        <label class="topbar-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="topSearch" placeholder="搜索错题、知识点…"></label>
        <button class="btn btn-primary btn-sm" data-action="upload"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>拍照诊断</button>
        <span class="top-avatar">何</span>
      </div>
    </header>
    <main class="view" id="view"></main>
  </div>

  <!-- ===== 移动端底部导航 ===== -->
  <nav class="mobile-nav">
    <a href="#/dashboard" data-nav="dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg><span>今日</span></a>
    <a href="#/mistakes" data-nav="mistakes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 4.5v15"/></svg><span>错题本</span></a>
    <button class="mnav-add" data-action="upload" aria-label="拍照诊断">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <a href="#/practice" data-nav="practice"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.2"/></svg><span>训练</span></a>
    <a href="#/report" data-nav="report"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>报告</span></a>
  </nav>
</div>

<div class="toast-wrap" id="toastWrap"></div>
<div class="modal-root" id="modalRoot"></div>

<script src="js/data.js"></script>
<script src="js/ai.js"></script>
<script src="js/app.js"></script>
</body>
</html>
